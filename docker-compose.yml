services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file: .env
    environment:
      DATABASE_URL: file:/data/app.db
    volumes:
      - app_data:/data
  worker:
    build: .
    restart: unless-stopped
    command: ["sh", "-c", "npx prisma migrate deploy && npm run worker"]
    env_file: .env
    environment:
      DATABASE_URL: file:/data/app.db
    volumes:
      - app_data:/data
    depends_on:
      - app
volumes:
  app_data:
